# The probes of the bug-class rig (packages/rig). Each probe runs the matrix of its class on the pinned clients, with a
# scripted server in the test process. The JSON report of each probe is an artifact of each run. The probes start many
# servers and clients, so they run here and not on a shared computer. A class with the security flag yes never runs here.
name: Rig probes

on:
  pull_request:
    paths:
      - packages/rig/**
      - .github/workflows/rig.yml
  # A person starts a run from the Actions page of the workflow
  workflow_dispatch:
  # Each week, so that the suite keeps a current record of the pinned clients
  schedule:
    - cron: "4 6 * * 1"

permissions:
  contents: read

# A newer push cancels the run of a pull request. Each commit has its own group for the other events.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The context runner does not exist in the env of a job, so the path goes to GITHUB_ENV in a step.
      - name: Set the path of the report
        run: echo "REPORT=$RUNNER_TEMP/rig-report.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The targets use the global fetch of Node 24.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the probes
        working-directory: packages/rig
        env:
          RIG: "1"
          RIG_REPORT: ${{ runner.temp }}/rig-c017.json
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile.json="$REPORT"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rig
          path: |
            ${{ runner.temp }}/rig-report.json
            ${{ runner.temp }}/rig-c017.json
          if-no-files-found: warn
          retention-days: 30

  # The arms of packages/rig/src/arms.json: each fix and its base commit, built from source.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.arms.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: arms
        run: |
          node -e '
            const arms = require("./packages/rig/src/arms.json");
            const rows = arms.flatMap((arm) => ["base", "fixed"].map((kind) => ({
              id: arm.id, kind, repository: arm.repository, commit: kind === "base" ? arm.base : arm.fix,
              build: arm.build, folder: arm.folder, copy: arm.copy.join(" "), package: arm.package,
            })));
            console.log(`matrix=${JSON.stringify(rows)}`);
          ' >> "$GITHUB_OUTPUT"

  arms:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    name: arm ${{ matrix.id }} (${{ matrix.kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check out the commit of the arm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.commit }}
          path: arm-src
          persist-credentials: false
      - name: Build the package
        working-directory: arm-src
        env:
          BUILD: ${{ matrix.build }}
        run: bash -c "$BUILD"
      - name: Put the build in place of each installed release
        env:
          PACKAGE: ${{ matrix.package }}
          FOLDER: ${{ matrix.folder }}
          COPY: ${{ matrix.copy }}
        run: |
          shopt -s nullglob
          found=0
          for dir in node_modules/.pnpm/"${PACKAGE/\//+}"@*/node_modules/"$PACKAGE"; do
            for part in $COPY; do
              rm -rf "${dir:?}/$part"
              cp -r "arm-src/$FOLDER/$part" "$dir/$part"
            done
            echo "The build of the arm replaces $dir."
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then echo "The workspace has no installed $PACKAGE."; exit 1; fi
      - name: Run the probe of the arm
        working-directory: packages/rig
        env:
          RIG: "1"
          RIG_ARM: ${{ matrix.id }}
          RIG_ARM_KIND: ${{ matrix.kind }}
          RIG_REPORT: ${{ runner.temp }}/rig-arm.json
        run: pnpm exec vitest run src/probes --reporter=default
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rig-arm-${{ matrix.id }}-${{ matrix.kind }}
          path: ${{ runner.temp }}/rig-arm-*.json
          if-no-files-found: warn
          retention-days: 30
