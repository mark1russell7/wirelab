# The conformance suite of the Socket.IO client socket.io-client (packages/suite-socketio). The scripted Engine.IO
# server of packages/suite-engineio gives a fixed list of replies, so the job needs no Socket.IO server. The JSON report
# of Vitest is an artifact of each run. Some tests use the delays of the scripted server, so the suite runs here and not
# on a shared computer.
name: Suite Socket.IO

on:
  pull_request:
    paths:
      - packages/suite-socketio/**
      - packages/suite-engineio/**
      - .github/workflows/suite-socketio.yml
  # A person starts a run: gh workflow run suite-socketio.yml
  workflow_dispatch:
  # Each week, so that a new release of socket.io-client in the range of package.json gets a run
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

# A newer push cancels the run of a pull request. Each commit has its own group for the other events.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The context runner does not exist in the env of a job, so the path goes to GITHUB_ENV in a step.
      - name: Set the path of the report
        run: echo "REPORT=$RUNNER_TEMP/suite-socketio-report.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the suite
        working-directory: packages/suite-socketio
        env:
          SUITE_SOCKETIO: "1"
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile.json="$REPORT"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-socketio
          path: ${{ runner.temp }}/suite-socketio-report.json
          if-no-files-found: warn
          retention-days: 30
