# The repros of the campaign. A repro is a folder repros/<package>/<finding> with a package.json that pins the exact
# versions, and a script run.sh. The job installs the folder with npm, runs run.sh and keeps its output as an artifact.
# The computer of the campaign is shared, and its memory is often full, so the repros of public findings run here.
# A repro of a security finding never goes in this repository: it stays in the private repository of held work.
name: Repro

on:
  # A person starts a run: gh workflow run repro.yml --ref <branch> -f dir=sockjs-client/F0068
  # One job can run more folders, in their order: -f dir="@microsoft/signalr/F0100 @microsoft/signalr/F0101"
  # One job uses one runner, so a group of repros does not fill the queue of the runners.
  workflow_dispatch:
    inputs:
      dir:
        description: The folder of the repro, under repros/. For more folders in one job, separate them with spaces.
        required: true
        type: string
      node:
        description: The major version of Node.js
        required: false
        default: "24"
        type: string

# Runs of the same folders on the same Node.js version wait for each other. Runs of other folders start at once.
concurrency:
  group: repro-${{ inputs.dir }}-node${{ inputs.node }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  repro:
    name: Repro ${{ inputs.dir }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The context runner is not available in the env of a job, so the step Run sets OUT from RUNNER_TEMP.
    env:
      DIR: ${{ inputs.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node }}
      # Each folder must be a relative path under repros/ with a run.sh. The name of the artifact cannot have a slash.
      # The artifact has the name of the first folder, and for more folders, their count.
      - name: Check the folders
        id: folder
        run: |
          read -ra dirs <<< "$DIR"
          if (( ${#dirs[@]} == 0 )); then
            echo "Give at least one folder." >&2
            exit 1
          fi
          for d in "${dirs[@]}"; do
            if [[ ! "$d" =~ ^[A-Za-z0-9@._-]+(/[A-Za-z0-9@._-]+)*$ || "$d" == *..* ]]; then
              echo "Each folder must be a relative path under repros/ with no '..': $d" >&2
              exit 1
            fi
            if [[ ! -f "repros/$d/run.sh" ]]; then
              echo "repros/$d/run.sh does not exist." >&2
              exit 1
            fi
          done
          name="repro-${dirs[0]//\//-}"
          if (( ${#dirs[@]} > 1 )); then
            name="$name-and-$(( ${#dirs[@]} - 1 ))-more"
          fi
          echo "artifact=$name" >> "$GITHUB_OUTPUT"
      # Install scripts do not run: the packages of a repro are code of others.
      # A folder can share packages with its parent folders, as the fix tests do: each package.json on the path
      # from repros/ to the folder installs, the parent first. A parent of more folders installs one time.
      - name: Install
        run: |
          declare -A installed
          read -ra dirs <<< "$DIR"
          for d in "${dirs[@]}"; do
            path=repros
            IFS=/ read -ra parts <<< "$d"
            for part in "${parts[@]}"; do
              path="$path/$part"
              if [[ -f "$path/package.json" && -z "${installed[$path]:-}" ]]; then
                installed[$path]=1
                (cd "$path" && npm install --ignore-scripts --no-audit --no-fund && { npm ls --depth=0 || true; })
              fi
            done
          done
      # A repro in TypeScript has a tsconfig.json, in its folder or in a parent folder. Its types must check before it runs.
      - name: Type check
        run: |
          declare -A checked
          read -ra dirs <<< "$DIR"
          for d in "${dirs[@]}"; do
            path=repros
            IFS=/ read -ra parts <<< "$d"
            for part in "${parts[@]}"; do
              path="$path/$part"
              if [[ -f "$path/tsconfig.json" && -z "${checked[$path]:-}" ]]; then
                checked[$path]=1
                (cd "$path" && npx --no-install tsc -p .)
              fi
            done
          done
      # A repro of a fault exits with a code that is not 0. The job records the code and passes when each run.sh ran.
      # One folder writes its output to the top of the artifact. With more folders, each folder has a subfolder.
      - name: Run
        run: |
          root="$RUNNER_TEMP/repro-out"
          read -ra dirs <<< "$DIR"
          set +e +o pipefail
          {
            echo "| Folder | Exit code of run.sh |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for d in "${dirs[@]}"; do
            OUT="$root"
            if (( ${#dirs[@]} > 1 )); then
              OUT="$root/${d//\//-}"
            fi
            mkdir -p "$OUT"
            {
              echo "repro: repros/$d"
              echo "commit: $GITHUB_SHA"
              echo "node: $(node --version), os: $(uname -sr)"
              echo
            } > "$OUT/output.txt"
            (cd "repros/$d" && OUT="$OUT" bash run.sh 2>&1) | tee -a "$OUT/output.txt"
            code=${PIPESTATUS[0]}
            echo "run.sh exit code: $code" | tee -a "$OUT/output.txt"
            echo "| repros/$d | $code |" >> "$GITHUB_STEP_SUMMARY"
            echo
          done
      - name: Upload the output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.folder.outputs.artifact }}
          path: ${{ runner.temp }}/repro-out
          if-no-files-found: warn
          retention-days: 90
