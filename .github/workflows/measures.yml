# The measures of use of each package of the catalog. The job starts scripts/measures.ts, which reads the npm downloads
# API, deps.dev and the jsDelivr data API through polite-crawler. It keeps the new sources.json and usage.json as an
# artifact. The computer of the campaign is shared, and its memory is often full, so this read runs here.
#
# Each week, the scheduled run reads all packages. When the tables change, the job push puts them on a new branch
# measures/<date>-<run id>. A workflow of this repository cannot open a pull request, so the session of the campaign
# opens it from that branch. The job push runs no code of the repository: it only copies the two JSON files.
name: Measures

on:
  # Each Tuesday at 07:23 UTC. The Monday mornings already have the suites and the dependency updates.
  schedule:
    - cron: "23 7 * * 2"
  # A person starts a run: gh workflow run measures.yml --ref <branch> [-f only=<count>] [-f push=true]
  # Then: gh run download <run id> -n measures
  workflow_dispatch:
    inputs:
      only:
        description: Read only the first packages of the catalog, for a short trial. Empty reads all packages.
        required: false
        default: ""
        type: string
      push:
        description: Push the new tables to a branch measures/<date>-<run id>. A read of only some packages never pushes.
        required: false
        default: false
        type: boolean

# Runs of the same branch wait for each other.
concurrency:
  group: measures-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  measures:
    name: Measures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.change.outputs.changed }}
    env:
      ONLY: ${{ inputs.only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Read the measures
        run: node scripts/measures.ts --summary="$GITHUB_STEP_SUMMARY" ${ONLY:+--only="$ONLY"}
      - name: Show the change
        id: change
        run: |
          git diff --stat -- packages/catalog/src/data
          if git diff --quiet -- packages/catalog/src/data/sources.json packages/catalog/src/data/usage.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the tables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measures
          path: |
            packages/catalog/src/data/sources.json
            packages/catalog/src/data/usage.json
          retention-days: 7

  push:
    name: Push the tables
    needs: measures
    # Only a read of all packages pushes: the scheduled run, or a run that a person starts with push=true and no only.
    if: needs.measures.outputs.changed == 'true' && (github.event_name == 'schedule' || (inputs.push && inputs.only == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: measures
          path: ${{ runner.temp }}/measures
      - name: Commit and push the tables
        env:
          GH_TOKEN: ${{ github.token }}
          TABLES: ${{ runner.temp }}/measures
        run: |
          for file in sources.json usage.json; do
            jq empty "$TABLES/$file"
            cp "$TABLES/$file" "packages/catalog/src/data/$file"
          done
          day="$(date -u +%F)"
          branch="measures/${day}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/catalog/src/data/sources.json packages/catalog/src/data/usage.json
          git commit -m "data(catalog): the measures of use of ${day}" -m "The Measures run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} read them."
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"
          {
            echo "## The tables are on a branch"
            echo
            echo "Branch: \`${branch}\`. Open the pull request: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
