# The measures of use of each package of the catalog. The job starts scripts/measures.ts, which reads the npm downloads
# API, deps.dev and the jsDelivr data API through polite-crawler. It keeps the new sources.json and usage.json as an
# artifact. A person downloads them and commits them in a pull request. The computer of the campaign is shared, and
# its memory is often full, so this read runs here.
name: Measures

on:
  # A person starts a run: gh workflow run measures.yml --ref <branch> [-f only=<count>]
  # Then: gh run download <run id> -n measures
  workflow_dispatch:
    inputs:
      only:
        description: Read only the first packages of the catalog, for a short trial. Empty reads all packages.
        required: false
        default: ""
        type: string

# Runs of the same branch wait for each other.
concurrency:
  group: measures-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  measures:
    name: Measures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ONLY: ${{ inputs.only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Read the measures
        run: node scripts/measures.ts --summary="$GITHUB_STEP_SUMMARY" ${ONLY:+--only="$ONLY"}
      - name: Show the change
        run: git diff --stat -- packages/catalog/src/data
      - name: Upload the tables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measures
          path: |
            packages/catalog/src/data/sources.json
            packages/catalog/src/data/usage.json
          retention-days: 7
