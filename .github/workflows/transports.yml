# The transports of each package of the catalog (roadmap item W8). The job starts scripts/transports.ts: it reads the
# tarball of the newest version of each package from the registry and checks its hash. It reads the published files
# with the facts command of codeatlas (--files published), and finds the markers of the transports.
# It keeps the new sources.json and transport-uses.json as an artifact.
#
# The versions come from the registry table, and the markers from transport-markers.json. A change of one of them, or
# a new pin of codeatlas, needs a new read. With push=true, the job push puts the tables on a new branch
# transports/<date>-<run id>. A workflow of this repository cannot open a pull request, so the session of the
# campaign opens it from that branch. The job push starts no script of the repository: its action push-tables copies
# the two JSON files with jq and git.
name: Transports

on:
  # A person starts a run: gh workflow run transports.yml --ref <branch> [-f only=<count>] [-f push=true]
  # Then: gh run download <run id> -n transports
  workflow_dispatch:
    inputs:
      only:
        description: Read only the first packages of the catalog, for a short trial. Empty reads all packages.
        required: false
        default: ""
        type: string
      push:
        description: Push the new tables to a branch transports/<date>-<run id>. A read of only some packages never pushes.
        required: false
        default: false
        type: boolean

# Runs of the same branch wait for each other.
concurrency:
  group: transports-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # codeatlas is not on npm, so the job checks out this commit of its repository. Change the pin in a pull request.
  CODEATLAS_REF: 794c00ca76b11e36df259b39b813dfa8387492bd

jobs:
  transports:
    name: Transports
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.change.outputs.changed }}
    env:
      ONLY: ${{ inputs.only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mark1russell7/codeatlas
          ref: ${{ env.CODEATLAS_REF }}
          path: .codeatlas
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Install codeatlas
        working-directory: .codeatlas
        run: pnpm install --frozen-lockfile
      - name: Read the transports
        run: node scripts/transports.ts --codeatlas=.codeatlas --work="$RUNNER_TEMP/transports" --summary="$GITHUB_STEP_SUMMARY" ${ONLY:+--only="$ONLY"}
      - name: Show the change
        id: change
        run: |
          git diff --stat -- packages/catalog/src/data
          if git diff --quiet -- packages/catalog/src/data/sources.json packages/catalog/src/data/transport-uses.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the tables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transports
          path: |
            packages/catalog/src/data/sources.json
            packages/catalog/src/data/transport-uses.json
          retention-days: 7

  push:
    name: Push the tables
    needs: transports
    # Only a read of all packages pushes: a run that a person starts with push=true and no only.
    if: needs.transports.outputs.changed == 'true' && inputs.push && inputs.only == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: transports
          path: ${{ runner.temp }}/transports
      - name: Commit and push the tables
        uses: ./.github/actions/push-tables
        with:
          tables: ${{ runner.temp }}/transports
          files: sources.json transport-uses.json
          prefix: transports
          subject: "data(catalog): the transports of"
          token: ${{ github.token }}
