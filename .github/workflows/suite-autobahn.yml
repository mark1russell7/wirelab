# The Autobahn WebSocket test suite against four WebSocket clients (packages/suite-autobahn). The job starts the fuzzing
# server of crossbario/autobahn-testsuite in Docker, at a fixed digest. The suite connects each client to each case.
# The reports of the server, its log and the JSON report of Vitest are artifacts of each run.
# The cases 9.* measure speed with large messages. They take a long time and find no conformance fault, so the config
# excludes them.
name: Suite Autobahn

on:
  pull_request:
    paths:
      - packages/suite-autobahn/**
      - .github/workflows/suite-autobahn.yml
  # A person starts a run: gh workflow run suite-autobahn.yml
  workflow_dispatch:
  # Each week, so that a new release of a client in the range of package.json gets a run
  schedule:
    - cron: "20 6 * * 1"

permissions:
  contents: read

# A newer push cancels the run of a pull request. Each commit has its own group for the other events.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The context runner does not exist in the env of a job, so the paths go to GITHUB_ENV in a step.
      - name: Set the paths of the reports and the log
        run: |
          echo "AUTOBAHN_REPORTS=$RUNNER_TEMP/autobahn" >> "$GITHUB_ENV"
          echo "SERVER_LOG=$RUNNER_TEMP/fuzzingserver.log" >> "$GITHUB_ENV"
          echo "REPORT=$RUNNER_TEMP/suite-autobahn-report.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image 25.10.1 at a fixed digest, so that a change of the suite does not change the results. The server
      # writes its reports to /reports/clients in the container: that is the folder AUTOBAHN_REPORTS on the runner.
      - name: Start the fuzzing server
        run: |
          mkdir -p "$AUTOBAHN_REPORTS"
          docker run --detach --name fuzzingserver \
            --volume "$GITHUB_WORKSPACE/packages/suite-autobahn/config:/config:ro" \
            --volume "$AUTOBAHN_REPORTS:/reports" \
            --publish 127.0.0.1:9001:9001 \
            crossbario/autobahn-testsuite@sha256:519915fb568b04c9383f70a1c405ae3ff44ab9e35835b085239c258b6fac3074 \
            wstest --mode fuzzingserver --spec /config/fuzzingserver.json
      - name: Wait for port 9001
        run: |
          for attempt in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/9001) 2>/dev/null; then
              echo "The fuzzing server accepts connections after $attempt attempts."
              exit 0
            fi
            sleep 1
          done
          echo "The fuzzing server does not accept connections on port 9001." >&2
          docker logs fuzzingserver >&2
          exit 1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the suite
        working-directory: packages/suite-autobahn
        env:
          AUTOBAHN_URL: ws://127.0.0.1:9001
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile.json="$REPORT"
      - name: Save the log of the fuzzing server
        if: always()
        run: docker logs fuzzingserver > "$SERVER_LOG" 2>&1 || echo "The fuzzing server has no log."
      - name: Upload the reports, the log and the report of Vitest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-autobahn
          path: |
            ${{ runner.temp }}/autobahn
            ${{ runner.temp }}/fuzzingserver.log
            ${{ runner.temp }}/suite-autobahn-report.json
          if-no-files-found: warn
          retention-days: 30
