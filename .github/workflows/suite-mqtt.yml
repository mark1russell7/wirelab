# The conformance suite of the MQTT client MQTT.js (packages/suite-mqtt). The job starts the Eclipse Paho test broker
# at a fixed commit and runs the suite against it. The broker log and the JSON report of Vitest are artifacts of each run.
# The suite has timing tests (Keep Alive, Will Delay, Session Expiry), so it runs here and not on a shared computer.
name: Suite MQTT

on:
  pull_request:
    paths:
      - packages/suite-mqtt/**
      - .github/workflows/suite-mqtt.yml
  # A person starts a run: gh workflow run suite-mqtt.yml
  workflow_dispatch:
  # Each week, so that a new release of MQTT.js in the range of package.json gets a run
  schedule:
    - cron: "38 6 * * 1"

permissions:
  contents: read

# A newer push cancels the run of a pull request. Each commit has its own group for the other events.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BROKER_LOG: ${{ runner.temp }}/paho-broker.log
      REPORT: ${{ runner.temp }}/suite-mqtt-report.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Paho test broker at a fixed commit, so that a change of the broker does not change the results
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: eclipse-paho/paho.mqtt.testing
          ref: fdab9d2b1ce125385135e5d9f282a0ad315268cc
          path: paho
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The broker runs in the background until the job ends. Its log goes to a file.
      - name: Start the broker
        working-directory: paho/interoperability
        run: nohup python3 startbroker.py -c "$GITHUB_WORKSPACE/packages/suite-mqtt/broker.conf" > "$BROKER_LOG" 2>&1 &
      - name: Wait for port 1883
        run: |
          for attempt in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/1883) 2>/dev/null; then
              echo "The broker accepts connections after $attempt attempts."
              exit 0
            fi
            sleep 1
          done
          echo "The broker does not accept connections on port 1883." >&2
          cat "$BROKER_LOG" >&2
          exit 1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the suite
        working-directory: packages/suite-mqtt
        env:
          MQTT_BROKER_URL: mqtt://127.0.0.1:1883
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile.json="$REPORT"
      - name: Upload the broker log and the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-mqtt
          path: |
            ${{ runner.temp }}/paho-broker.log
            ${{ runner.temp }}/suite-mqtt-report.json
          if-no-files-found: warn
          retention-days: 30
